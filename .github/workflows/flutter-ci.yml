name: Project checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build production web bundle
        run: >-
          flutter build web --release
          --dart-define=KINQUEST_API_BASE_URL=https://api.sila.invalid

      - name: Verify configured production API endpoint
        run: grep --fixed-strings --quiet "https://api.sila.invalid" build/web/main.dart.js

      - name: Upload production web bundle
        uses: actions/upload-artifact@v4
        with:
          name: sila-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check server.js

      - name: Run backend tests
        run: npm test

      - name: Audit production dependencies
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          timeout 90s npm audit --omit=dev --audit-level=high \
            2>&1 | tee "$RUNNER_TEMP/npm-audit.log"
          audit_status=${PIPESTATUS[0]}
          set -e

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$audit_status" -eq 124 ] || \
             grep -Eq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|ENETUNREACH|EAI_AGAIN' \
               "$RUNNER_TEMP/npm-audit.log"; then
            echo "::warning::npm audit service was unavailable; application tests still passed."
            exit 0
          fi

          exit "$audit_status"

  firebase-rules:
    name: Firebase rules validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        working-directory: backend
        run: npm ci --no-audit --fund=false --prefer-offline

      - name: Compile Firebase rules in isolated emulators
        run: >-
          npx --yes firebase-tools@15.27.0 emulators:exec
          --only firestore,storage
          --project demo-kinquest
          "npm --prefix backend run test:rules"
